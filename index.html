<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>铅当量测量分析系统</title>
    <!-- 引入 Chart.js (用于曲线图) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <h1>🛡️ 铅当量测量分析系统</h1>
            <span class="nav-status" id="navStatus">未加载图像</span>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <div class="main-container">
        <!-- 左侧面板：图像 + 上传 -->
        <div class="left-panel">
            <div class="upload-area">
                <form id="uploadForm" enctype="multipart/form-data">
                    <label for="fileInput" class="upload-btn">📂 选择DICOM文件（可多选或上传ZIP）</label>
                    <input type="file" id="fileInput" name="dicom_files" multiple accept=".dcm,.zip" style="display:none;">
                    <button type="submit" class="btn btn-primary" id="uploadBtn">上传并加载</button>
                    <span id="fileCount" style="margin-left:10px;color:#1a3a6b;"></span>
                </form>
            </div>
            <div class="canvas-wrapper">
                <canvas id="imageCanvas" width="800" height="600"></canvas>
                <div class="canvas-tip" id="canvasTip">请上传图像后，按顺序框选标定块</div>
            </div>
            <div class="image-controls">
                <button class="btn btn-secondary" id="prevImageBtn">◀ 上一张</button>
                <span id="imageIndexDisplay">1 / 1</span>
                <button class="btn btn-secondary" id="nextImageBtn">下一张 ▶</button>
                <button class="btn btn-danger" id="resetBtn">🔄 重置标定</button>
            </div>
        </div>

        <!-- 右侧面板 -->
        <div class="right-panel">
            <!-- 曲线图 -->
            <div class="curve-container">
                <h3>📈 标定曲线</h3>
                <canvas id="curveChart" width="400" height="300"></canvas>
                <div id="curveStats" class="curve-stats">等待标定数据...</div>
            </div>

            <!-- 结果面板 -->
            <div class="result-panel">
                <h3>📋 分析结果</h3>
                <div id="resultContent">
                    <p class="hint">请先完成标定，然后框选测量区域。</p>
                </div>
                <button class="btn btn-primary" id="exportPdfBtn" style="margin-top:10px;">📄 导出PDF报告</button>
            </div>
        </div>
    </div>

    <!-- 状态提示条 -->
    <div class="status-bar" id="statusBar">准备就绪</div>

    <!-- 引入自定义 JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
